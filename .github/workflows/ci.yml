name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: swellbook
          POSTGRES_PASSWORD: swellbook
          POSTGRES_DB: swellbook
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U swellbook"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20

    env:
      DATABASE_URL: postgres://swellbook:swellbook@localhost:5433/swellbook
      TEST_DATABASE_URL: postgres://swellbook:swellbook@localhost:5433/swellbook_test

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:seed
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm race
      - run: pnpm build
